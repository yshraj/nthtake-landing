<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 256" width="880" height="256"
     role="img" aria-labelledby="et-h-title">
  <title id="et-h-title">EditTrack Horizontal Lockup</title>

  <!-- ── SYMBOL — V4 Pill Playhead ── -->
  <defs>
    <mask id="logo-cut">
      <rect x="0" y="0" width="256" height="256" fill="white"/>
      <rect x="148" y="16" width="16" height="224" rx="8" fill="black"/>
    </mask>
  </defs>
  <g id="symbol">
    <rect x="24" y="52" width="208" height="24" rx="8" fill="#3A3530" mask="url(#logo-cut)"/>
    <rect x="24" y="88" width="208" height="72" rx="8" fill="#111111" mask="url(#logo-cut)"/>
    <rect x="24" y="172" width="208" height="36" rx="8" fill="#3A3530" mask="url(#logo-cut)"/>
    <rect x="152" y="44" width="8" height="168" rx="4" fill="#C65A32"/>
    <circle cx="156" cy="34" r="9" fill="#C65A32"/>
  </g>

  <!-- ── WORDMARK ── -->
  <!-- FLAG: Live <text>, Inter Tight 800. Must be outlined before print/production. -->
  <!-- Optically aligned: baseline sits at y=172 (bottom of video track) -->
  <text
    x="272" y="168"
    font-family="'Inter Tight', Inter, system-ui, sans-serif"
    font-weight="800"
    font-size="108"
    letter-spacing="-3"
    fill="#111111"
  >EditTrack</text>

</svg>
